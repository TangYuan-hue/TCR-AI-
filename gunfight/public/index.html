<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D 联机枪战 · 多人模式</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 加载/开始画面 -->
  <div id="startScreen" class="overlay">
    <div class="panel">
      <h1 class="title">3D 联机枪战</h1>
      <p class="subtitle">第一人称 · 多人在线 · 人机混战</p>
      <input id="nameInput" type="text" maxlength="12" placeholder="输入昵称（回车继续）" />
      <button id="startBtn" class="btn">选择装备</button>
      <div class="controls">
        <div><b>移动</b> WASD &nbsp; <b>疾跑</b> Shift &nbsp; <b>跳跃</b> 空格</div>
        <div><b>蹲下</b> X &nbsp; <b>趴下</b> Z &nbsp; <b>开镜</b> 右键</div>
        <div><b>射击</b> 左键 &nbsp; <b>换弹</b> R &nbsp; <b>切枪</b> 1/2</div>
        <div><b>排行榜</b> Tab &nbsp; <b>安放/拆除炸弹</b> E</div>
      </div>
    </div>
  </div>

  <!-- 选枪界面（模式 → 枪种 → 枪械） -->
  <div id="loadoutScreen" class="overlay hidden">
    <div class="panel loadout-panel">
      <h2 class="loadout-title">选择装备</h2>
      <!-- 步骤 1：模式 -->
      <div id="stepMode">
        <div class="step-label">① 选择游戏模式</div>
        <div id="modeList" class="mode-grid"></div>
      </div>
      <!-- 步骤 2：枪种 -->
      <div id="stepCategory" class="hidden">
        <div class="step-label">② 选择枪种</div>
        <div id="categoryList" class="cat-grid"></div>
        <button id="backToMode" class="btn ghost">← 返回</button>
      </div>
      <!-- 步骤 3：枪械 -->
      <div id="stepWeapon" class="hidden">
        <div class="step-label">③ 选择具体枪械</div>
        <div id="weaponList" class="weapon-grid"></div>
        <div id="weaponStats" class="stats-box"></div>
        <button id="backToCat" class="btn ghost">← 返回</button>
      </div>
      <button id="confirmLoadout" class="btn primary hidden">进入战斗</button>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="topBar">
      <div id="scoreBox">
        <span id="modeText" class="mode-tag"></span>
        <span id="scoreText">0 杀 / 0 死</span>
        <span id="teamScore" class="muted"></span>
        <span id="botsText" class="muted"></span>
      </div>
      <div id="stanceBox">
        <span id="bombStatus" class="hidden"></span>
        <span id="stanceText">站立</span>
      </div>
    </div>

    <div id="crosshair">
      <span class="ch-line top"></span>
      <span class="ch-line bottom"></span>
      <span class="ch-line left"></span>
      <span class="ch-line right"></span>
      <span id="chDot"></span>
    </div>
    <div id="adsDot" class="hidden"></div>

    <div id="reloadHint" class="hidden">
      <div class="rh-label">换弹中</div>
      <div id="reloadBar"><div id="reloadFill"></div></div>
      <div id="reloadCount">0.0s</div>
    </div>

    <div id="hitmarker" class="hidden">
      <span class="hm l1"></span><span class="hm l2"></span>
      <span class="hm l3"></span><span class="hm l4"></span>
    </div>

    <div id="damageIndicator" class="hidden">▲</div>
    <div id="damageFlash" class="hidden"></div>
    <div id="shotIndicator" class="hidden">▲</div>
    <div id="scopeVignette" class="hidden"></div>
    <div id="killfeed"></div>

    <div id="bottomBar">
      <div id="hpBox">
        <div id="hpBar"><div id="hpFill"></div></div>
        <span id="hpText">100</span>
        <div id="armorBar"><div id="armorFill"></div></div>
        <span id="armorText">100</span>
      </div>
      <div id="weaponBox">
        <span id="weaponName">AK-47</span>
        <span id="slotHint" class="muted"></span>
      </div>
      <div id="ammoBox">
        <span id="ammo">30</span>
        <span class="muted" id="ammoMax">/ 30</span>
        <span id="reloadText" class="hidden">换弹中…</span>
      </div>
    </div>

    <!-- 回合结束 -->
    <div id="roundResult" class="hidden">
      <div id="roundResultText"></div>
    </div>
  </div>

  <!-- 死亡画面 -->
  <div id="deathScreen" class="overlay hidden">
    <div class="panel">
      <h2 class="death-title">你被击倒了</h2>
      <p id="respawnText">3 秒后重生…</p>
    </div>
  </div>

  <!-- 排行榜 -->
  <div id="leaderboard" class="hidden">
    <h3>排行榜</h3>
    <table id="boardTable">
      <thead><tr><th>#</th><th>玩家</th><th>击杀</th><th>死亡</th><th>得分</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="lb-hint">按 Tab 关闭</div>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
